type Account @entity {
  id: Bytes!
  balances: [Balance!]! @derivedFrom(field: "account")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

type Balance @entity {
  id: Bytes!                # Composite key: account + contract name
  account: Account!         # Reference to the account
  contract: String!     # Contract Address 
  amount: BigInt!          
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

type Deposit @entity {
  id: ID!
  account: Account!
  provider: Bytes!
  value: BigInt!
  contract: String! 
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type Withdraw @entity {
  id: ID!
  account: Account!
  provider: Bytes!
  value: BigInt!
  contract: String! 
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type Transfer @entity {
  id: ID!
  from: Bytes!
  to: Bytes!
  value: BigInt!
  contract: String! 
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type LiquidityLimit @entity {
  id: ID!
  accountEntity: Account!
  account: Bytes!
  originalBalance: BigInt!
  originalSupply: BigInt!
  workingBalance: BigInt!
  workingSupply: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}
